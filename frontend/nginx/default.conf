server {
  listen 443 ssl;
  server_name 192.168.3.127;

  ssl_certificate /etc/nginx/ssl/server.crt;
  ssl_certificate_key /etc/nginx/ssl/server.key;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  server_name 192.168.3.127;
  return 301 https://$host$request_uri;
}
